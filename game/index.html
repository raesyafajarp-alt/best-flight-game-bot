<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garuda Ridge Run — bush courier over the volcanic islands</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a141c; }
  #game { position: relative; width: 100%; height: 100%; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #f2f6f8; }
  #game canvas { display: block; }
  .hidden { display: none !important; }

  /* ---- HUD ---- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 16px; }
  .hud-cluster { display: flex; gap: 18px; background: rgba(8, 20, 28, 0.62); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 8px 14px; }
  .hud-gauge { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .hud-label { font-size: 11px; letter-spacing: 2px; color: #9fd8e8; font-weight: 700; }
  .hud-value { font-size: 26px; font-weight: 800; line-height: 1.1; color: #fff; font-variant-numeric: tabular-nums; }
  .hud-value.low { color: #ff5d5d; }
  .hud-unit { font-size: 10px; color: #b9cdd6; }
  .hud-compass { position: relative; width: 280px; height: 34px; margin-top: 4px; background: rgba(8, 20, 28, 0.62); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; overflow: hidden; }
  .compass-mark { position: absolute; top: 8px; transform: translateX(-50%); font-size: 13px; font-weight: 700; color: #d7e8ee; }
  .compass-centre { position: absolute; left: 50%; top: 1px; transform: translateX(-50%); color: #ffd23f; font-size: 12px; }
  .hud-right { flex-direction: column; gap: 6px; padding: 10px 14px; }
  .hud-bar-row { display: flex; align-items: center; gap: 8px; }
  .hud-bar { width: 108px; height: 10px; background: rgba(255,255,255,0.18); border-radius: 5px; overflow: hidden; }
  .hud-bar.vertical { width: 14px; height: 90px; display: flex; flex-direction: column-reverse; }
  .hud-fill { height: 100%; border-radius: 5px; }
  .hud-fill.fuel { width: 100%; background: #37d67a; }
  .hud-fill.fuel.low { background: #ff5d5d; }
  .hud-fill.dmg { width: 0%; background: #ffb020; }
  .hud-fill.dmg.high { background: #ff3b30; }
  .hud-fill.thr { width: 100%; background: #35d0ff; }
  .hud-num { font-size: 13px; font-weight: 700; width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .hud-reticle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; color: rgba(255,255,255,0.85); text-shadow: 0 0 4px #000; }
  .hud-ring { position: absolute; left: 50%; top: 56%; transform: translateX(-50%); font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #ffd23f; text-shadow: 0 1px 4px #000; background: rgba(8,20,28,0.55); padding: 4px 12px; border-radius: 20px; }
  .hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 12px 16px; }
  .hud-panel { display: flex; align-items: flex-end; gap: 12px; background: rgba(8, 20, 28, 0.62); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 8px 12px; }
  .hud-throttle { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hud-msg { align-self: center; font-size: 22px; font-weight: 800; color: #ffd23f; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.2s; }
  .hud-msg.show { opacity: 1; }
  .hud-mission { flex-direction: column; align-items: flex-end; gap: 2px; }
  .hud-mission-name { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #ffd23f; }
  .hud-mission-obj { font-size: 13px; color: #d7e8ee; }
  .hud-score-row { display: flex; gap: 8px; align-items: baseline; }

  /* ---- Screens ---- */
  #overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; background: linear-gradient(180deg, rgba(6,18,28,0.55) 0%, rgba(6,18,28,0.25) 45%, rgba(6,18,28,0.72) 100%); pointer-events: auto; padding: 24px; }
  .screen h1 { font-size: 64px; line-height: 0.95; letter-spacing: 4px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #e8590c, 0 8px 24px rgba(0,0,0,0.6); }
  .screen h2 { font-size: 44px; letter-spacing: 3px; font-weight: 900; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,0.7); }
  .tagline { font-size: 18px; color: #e8f2f5; text-shadow: 0 1px 4px #000; }
  .brief { font-size: 15px; color: #cfe3ea; max-width: 560px; text-shadow: 0 1px 4px #000; }
  .brief span { font-weight: 700; color: #ffd23f; }
  .mission-buttons { display: flex; gap: 10px; }
  .mission-btn { pointer-events: auto; cursor: pointer; background: rgba(8,20,28,0.7); color: #d7e8ee; border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 10px 16px; font-size: 15px; font-weight: 700; }
  .mission-btn.selected { border-color: #ffd23f; color: #ffd23f; background: rgba(40,30,5,0.75); }
  .fly-btn { pointer-events: auto; cursor: pointer; background: #e8590c; color: #fff; border: none; border-radius: 10px; padding: 14px 42px; font-size: 20px; font-weight: 900; letter-spacing: 2px; box-shadow: 0 4px 0 #a83e05, 0 8px 20px rgba(0,0,0,0.45); }
  .fly-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a83e05; }
  .fly-btn.ghost { background: rgba(8,20,28,0.7); border: 2px solid rgba(255,255,255,0.4); box-shadow: none; font-size: 15px; padding: 10px 24px; }
  .controls { font-size: 13px; color: #b9cdd6; text-shadow: 0 1px 3px #000; }
  .controls.dim { color: #8fa9b5; }
  .end-score { font-size: 26px; font-weight: 900; color: #ffd23f; text-shadow: 0 2px 8px #000; }
  .end-score span { font-size: 34px; }
</style>
</head>
<body>
<div id="game"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
